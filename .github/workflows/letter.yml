name: Weekly Market Letter

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python src/fetch_data.py

      - name: Fetch news
        run: python src/fetch_news.py

      - name: Build prompt context
        run: python src/build_context.py

      - name: Draft letter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/draft_letter.py

      - name: Validate letter
        run: python src/validate.py

      - name: Render HTML
        run: python src/render_html.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data letters docs
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Weekly letter: $(date +'%Y-%m-%d')"
            git push
          fi
